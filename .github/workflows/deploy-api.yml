name: Deploy API

on:
  push:
    branches: [main]
    paths: ['Farrellsoft.PSEG.PoleImageApi/**']
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate
        run: |
          dotnet build Farrellsoft.PSEG.PoleImageApi/Farrellsoft.PSEG.PoleImageApi.csproj \
            --configuration Release

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Docker build and push
        run: |
          docker build \
            -t ${{ vars.ACR_NAME }}.azurecr.io/pole-image-api:${{ github.sha }} \
            -f Farrellsoft.PSEG.PoleImageApi/Dockerfile \
            Farrellsoft.PSEG.PoleImageApi
          docker push ${{ vars.ACR_NAME }}.azurecr.io/pole-image-api:${{ github.sha }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/pole-image-api:${{ github.sha }}
